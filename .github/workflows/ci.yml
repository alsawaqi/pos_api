# Phase D9 — CI for pos_api (JSON-only device API; Laravel app lives in src/).
#
# Plain PHPUnit (no pest), sqlite :memory: pinned by src/phpunit.xml —
# the device contract tests ARE the contract, so this job gates it.
# phpunit.xml also blanks CHARITY_API_URL (no outbound HTTP in tests).
# No frontend job: the repo has no package-lock.json / typecheck script.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: src

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pcntl, pdo_sqlite, sqlite3, simplexml, tokenizer, xml, xmlreader, xmlwriter, zlib
          ini-values: memory_limit=1G
          coverage: none
      - name: Composer cache dir
        id: cc
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cc.outputs.dir }}
          key: ${{ runner.os }}-composer-api-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-api-
      # .env must exist BEFORE composer install: its package:discover boots
      # the app, and without .env the broadcasting config tried to build the
      # reverb driver with no key. key:generate needs vendor/, so it stays
      # after. The storage skeleton is untracked — create it.
      - run: mkdir -p storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan key:generate
      - run: php artisan config:clear && php artisan test

  # Exercise the production nginx boundary through a real, isolated
  # client -> Cloudflare -> NPM -> nginx -> PHP-FPM/Laravel request chain.
  # This cannot live in PHPUnit: reverting the nginx configuration leaves the
  # PHP suite green, while this job's legacy negative control proves the
  # attribution assertions fail without the production nginx change.
  true-client-ip-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pcntl, pdo_sqlite, sqlite3, simplexml, tokenizer, xml, xmlreader, xmlwriter, zlib
          coverage: none
      - name: Composer cache dir
        id: cc
        working-directory: src
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.cc.outputs.dir }}
          key: ${{ runner.os }}-composer-api-${{ hashFiles('src/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-api-
      - name: Prepare Laravel dependencies
        working-directory: src
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache
          cp .env.example .env
          composer install --prefer-dist --no-interaction --no-progress
      - name: Verify the real true-client-IP request chain
        run: |
          set -o pipefail
          harness_log="$RUNNER_TEMP/true-client-ip.log"
          bash tests/Integration/TrueClientIp/run.sh 2>&1 | tee "$harness_log"
          pass_count="$(grep -c '^PASS:' "$harness_log" || true)"
          fail_count="$(grep -c '^FAIL:' "$harness_log" || true)"
          if [[ "$pass_count" != "114" || "$fail_count" != "0" ]]; then
            printf 'TrueClientIp evidence mismatch: expected 114 PASS / 0 FAIL, observed %s PASS / %s FAIL\n' \
              "$pass_count" "$fail_count" >&2
            exit 1
          fi
          grep -Fxq 'All real multi-hop true-client-IP checks passed.' "$harness_log"
          printf 'TrueClientIp evidence: %s PASS / %s FAIL\n' "$pass_count" "$fail_count"

  postgres-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: p0_test
          POSTGRES_PASSWORD: p0_disposable_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U p0_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      LAUNCH_P0_DISPOSABLE: '1'
      DB_CONNECTION: pgsql
      DB_HOST: qrfix2-pg
      DB_PORT: '5432'
      DB_DATABASE: postgres
      DB_USERNAME: p0_test
      DB_PASSWORD: p0_disposable_only
      DB_URL: ''
      CHARITY_API_URL: ''
      BROADCAST_CONNECTION: 'null'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      APP_KEY: 'base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE='
    steps:
      - uses: actions/checkout@v4
        with:
          path: pos_api
      # Owner must push companion branches after independent review.
      # Private cross-repo checkouts require POS_CI_READ_TOKEN with contents:read.
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_admin
          ref: launch-p0-tenancy
          path: pos_admin
          token: ${{ secrets.POS_CI_READ_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: alsawaqi/pos_merchant
          ref: launch-p0-tenancy
          path: pos_merchant
          token: ${{ secrets.POS_CI_READ_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, curl, dom, fileinfo, filter, iconv, mbstring, openssl, pcntl, pdo_pgsql, pdo_sqlite, sqlite3, simplexml, tokenizer, xml, xmlreader, xmlwriter, zlib
          ini-values: memory_limit=1G
          coverage: none
      - name: Prepare disposable real-schema job
        run: |
          echo '127.0.0.1 qrfix2-pg' | sudo tee -a /etc/hosts
          for app in pos_api pos_admin pos_merchant; do
            (
              cd "$app/src"
              mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
              cp .env.example .env
              composer install --prefer-dist --no-interaction --no-progress
            )
          done
      - name: Tenant isolation and all PostgreSQL races
        run: |
          set -o pipefail
          php pos_admin/tests/Postgres/run-launch-p0.php | tee postgres-job.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos_api-postgres-evidence
          path: postgres-job.log

  # ---- CD: auto-deploy to the production VPS ----
  # Push to main only (never PRs), and only after the device-contract tests
  # and real true-client-IP integration gate are green. SSHes into the VPS,
  # fetches without changing the bind-mounted checkout, verifies remote main
  # is the exact SHA those jobs tested, then fast-forwards and runs
  # deploy/deploy.sh — ending in the same health check as a manual release.
  # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (the dedicated gha-pos-deploy
  # key), VPS_KNOWN_HOSTS (pinned host key).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [php-tests, true-client-ip-integration, postgres-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy-pos-api
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Pull + deploy on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cd ~/pos_api && git fetch origin main && test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}" && git merge --ff-only FETCH_HEAD && bash deploy/deploy.sh'
