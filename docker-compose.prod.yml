x-pos-api-runtime-environment: &pos-api-runtime-environment
  APP_ENV: production
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  CACHE_STORE: redis
  REDIS_HOST: pos_api_redis

services:
  # ── PHP-FPM application (the device-facing JSON API) ──────────────────────
  pos_api:
    image: pos_api-app
    build:
      context: .
      dockerfile: docker/prod/php/php.dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    environment:
      <<: *pos-api-runtime-environment
    depends_on:
      - pos_api_redis
    networks:
      - charity_net

  # ── Laravel scheduler (API-002 stranded-event recovery) ──────────────────
  # This API is a separate image from pos_admin, so an admin scheduler cannot
  # execute its sync sweeper. No migrations run here; it only evaluates this
  # application's registered schedule once per minute.
  scheduler:
    image: pos_api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    environment:
      <<: *pos-api-runtime-environment
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - pos_api_redis
    networks:
      - charity_net

  # ── nginx (fronts php-fpm; Nginx Proxy Manager forwards to it by alias) ───
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      - pos_api
    volumes:
      - ./src/public:/var/www/html/public
      - storage-data:/var/www/html/storage
      - ./docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    expose:
      - "80"
    networks:
      charity_net:
        aliases:
          - pos-api-web

  # ── Redis (REQUIRED) ──────────────────────────────────────────────────────
  # pos_api's .env points SESSION_DRIVER, CACHE_STORE and QUEUE_CONNECTION at
  # REDIS_HOST=pos_api_redis, so the app will not boot without this. The name
  # is deliberately UNIQUE: charity_net hosts sibling projects that also have a
  # service named `redis`; a shared name makes Docker DNS round-robin between
  # instances and split sessions/cache across them. Keep it distinct.
  pos_api_redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - charity_net

  # ── One-time permissions fix (run when needed): --profile init ───────────
  init-perms:
    image: pos_api-app
    profiles: ["init"]
    user: "0:0"
    volumes:
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    entrypoint: ["sh", "-lc"]
    # LIST form — see the deploy service note (string commands get shell-lexed).
    command:
      - |
        set -e
        mkdir -p /var/www/html/storage/framework/cache \
                 /var/www/html/storage/framework/sessions \
                 /var/www/html/storage/framework/views \
                 /var/www/html/storage/logs \
                 /var/www/html/bootstrap/cache
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
        chmod -R ug+rwX /var/www/html/storage /var/www/html/bootstrap/cache
    restart: "no"
    networks:
      - charity_net

  # ── Install PHP deps into ./src/vendor (run on deploy): --profile build ──
  # NOTE: pos_api owns NO database schema (pos_admin owns the shared pos_*
  # tables), so there is intentionally NO `migrate` step here. Never run
  # `php artisan migrate` against the shared charity_db from this stack.
  # Runs in the APP image (composer is baked into it) so the platform check
  # validates against the REAL runtime extensions — the official composer:2
  # image lacks several and fails hard ext-* requires (e.g. ext-gd in the
  # pos_admin sibling). Build the image first (docker compose build).
  composer:
    profiles: ["build"]
    image: pos_api-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: composer install --no-dev --optimize-autoloader --no-interaction
    networks:
      - charity_net

  # ── Build Vite assets (run on deploy): --profile build ───────────────────
  # pos_api is a JSON-only device API and serves no SPA — BUT the default
  # welcome.blade.php still references @vite(['resources/css/app.css',
  # 'resources/js/app.js']), so a manifest must exist or hitting `/` 500s.
  # `npm install` (not `npm ci`) because there may be no lockfile. If you
  # delete the @vite line from welcome.blade.php you can drop this service.
  node-build:
    profiles: ["build"]
    image: node:20-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -lc "npm install && npm run build"
    networks:
      - charity_net

  # ── Cache Laravel config/routes/views (run after build): --profile deploy ─
  deploy:
    profiles: ["deploy"]
    image: pos_api-app
    working_dir: /var/www/html
    environment:
      <<: *pos-api-runtime-environment
    volumes:
      - ./src:/var/www/html:ro
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    entrypoint: ["sh", "-lc"]
    # The bare `rm` runs BEFORE any PHP boots: stale bootstrap caches in the
    # cache-data volume (written by the PREVIOUS release) can fatal artisan
    # itself, so `optimize:clear` alone can deadlock — it cannot clear the
    # caches that crash it. package:discover then rebuilds the package/service
    # manifests against the freshly-installed vendor/. (bootstrap/cache is the
    # writable cache-data volume even though ./src is mounted :ro.)
    # LIST form is load-bearing: a STRING command gets shell-lexed by compose
    # into tokens, so with the sh -lc entrypoint only the first word would run
    # (a bare `php` waiting on stdin forever — observed as a one-shot stuck
    # "Up 12 hours" in production).
    command:
      - |
        set -e
        rm -f bootstrap/cache/*.php
        php artisan optimize:clear
        php artisan package:discover --ansi
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache
    restart: "no"
    depends_on:
      - pos_api_redis
    networks:
      - charity_net

  # ── Real-time push (OPTIONAL, OFF by default): --profile reverb ──────────
  # Devices already subscribe through the Pusher-protocol-7 client. Reverb is
  # optional and off by default. To turn real-time ON:
  #   1. in .env: set BROADCAST_CONNECTION=reverb and
  #      REVERB_APP_ID / REVERB_APP_KEY / REVERB_APP_SECRET (php artisan
  #      reverb:install). Keep REVERB_HOST=pos_api_reverb for the internal
  #      publish target, and set REVERB_PUBLIC_HOST / REVERB_PUBLIC_PORT /
  #      REVERB_PUBLIC_SCHEME for the public wss endpoint.
  #   2. point a Proxy Manager host (e.g. wss://posapi.mithqal.net) at the
  #      `pos-api-reverb` alias : 8080.
  #   3. start only the required service: --profile reverb up -d reverb
  reverb:
    profiles: ["reverb"]
    image: pos_api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      - pos_api_redis
    expose:
      - "8080"
    networks:
      charity_net:
        aliases:
          - pos-api-reverb

  # Queue worker — NOT required by the Reverb broadcast path.
  # DeviceSyncBroadcast implements ShouldBroadcastNow and publishes
  # synchronously; reverb is the only service in this profile needed for
  # broadcasts. Start queue only for unrelated queued workloads.
  queue:
    profiles: ["reverb"]
    image: pos_api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - storage-data:/var/www/html/storage
      - cache-data:/var/www/html/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3", "--max-time=3600"]
    depends_on:
      - pos_api_redis
    networks:
      - charity_net

networks:
  charity_net:
    external: true

volumes:
  storage-data:
  cache-data:
  redis-data:
