# NPM overwrites X-Real-IP with its own network peer. Validate that value with
# nginx's IP parser; malformed or absent headers fall back to the socket peer.
geo $http_x_real_ip $x_real_ip_is_valid {
    default         1;
    255.255.255.255 0;
}

geo $http_cf_connecting_ip $cf_connecting_ip_is_valid {
    default         1;
    255.255.255.255 0;
}

geo $http_x_real_ip $x_real_ip_is_cloudflare {
    default 0;
    include /etc/nginx/cloudflare-ips.conf;
}

# Only a peer in Cloudflare's published ranges may nominate
# CF-Connecting-IP. Direct-origin callers are attributed to NPM's X-Real-IP.
map $x_real_ip_is_valid $validated_reported_peer {
    0 $remote_addr;
    1 $http_x_real_ip;
}

map "$x_real_ip_is_cloudflare:$cf_connecting_ip_is_valid" $true_client_ip {
    default $validated_reported_peer;
    "1:1"   $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 60M;
    server_tokens off;

    # Vite build assets caching
    location ^~ /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve Laravel public disk without needing storage:link
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ =404;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass pos_api:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param REMOTE_ADDR $true_client_ip;
        fastcgi_param HTTPS on;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}
