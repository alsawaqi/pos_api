name: pos-api-true-client-ip

services:
  test_redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      app_net:
        ipv4_address: 10.254.251.4

  pos_api:
    image: pos-api-true-client-ip-app
    build:
      context: ../../..
      dockerfile: docker/prod/php/php.dockerfile
    environment:
      APP_NAME: POS-API-True-Client-IP-Test
      APP_ENV: production
      # Deterministic 32-byte test-only key; this stack has no published port.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_URL: https://pos-api.test
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: redis
      CACHE_PREFIX: pos-api-true-client-ip-test
      REDIS_CLIENT: phpredis
      REDIS_HOST: test_redis
      REDIS_PORT: "6379"
      REDIS_CACHE_DB: "1"
      SESSION_DRIVER: file
      SESSION_SECURE_COOKIE: "true"
      SESSION_COOKIE: pos_api_true_client_ip_session
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      MAIL_MAILER: array
    command:
      - sh
      - -lc
      - >-
        chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache
        && exec php-fpm
    volumes:
      - ../../../src:/var/www/html:ro
      - ./fixtures/routes/web.php:/var/www/html/routes/web.php:ro
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    depends_on:
      test_redis:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: 10.254.251.3

  pos_nginx:
    image: nginx:1.25-alpine
    volumes:
      # This is the production file under test, not a copied fixture.
      - ../../../docker/prod/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../docker/prod/nginx/cloudflare-ips.conf:/etc/nginx/cloudflare-ips.conf:ro
      - ../../../src/public:/var/www/html/public:ro
    depends_on:
      - pos_api
    networks:
      app_net:
        ipv4_address: 10.254.251.2
      npm_to_app:
        ipv4_address: 10.254.252.3

  fake_npm:
    image: nginx:1.25-alpine
    volumes:
      - ./fixtures/npm/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pos_nginx
    networks:
      npm_to_app:
        ipv4_address: 10.254.252.2
      cloudflare_to_npm_v4:
        ipv4_address: 173.245.63.250
      cloudflare_to_npm_v6:
        ipv6_address: 2400:cb00:ffff:ffff::2
      direct_to_npm:
        ipv4_address: 203.0.113.2

  fake_cloudflare_v4:
    image: nginx:1.25-alpine
    volumes:
      - ./fixtures/cloudflare/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fake_npm
    networks:
      client_to_cloudflare_v4:
        ipv4_address: 198.51.100.2
      cloudflare_to_npm_v4:
        ipv4_address: 173.245.63.251

  fake_cloudflare_v6:
    image: nginx:1.25-alpine
    volumes:
      - ./fixtures/cloudflare/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fake_npm
    networks:
      client_to_cloudflare_v6:
        ipv6_address: 2001:db8:100::2
      cloudflare_to_npm_v6:
        ipv6_address: 2400:cb00:ffff:ffff::3

  client_v4:
    image: curlimages/curl:8.12.1
    entrypoint: ["sh", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    networks:
      client_to_cloudflare_v4:
        ipv4_address: 198.51.100.10

  client_v6_a:
    image: curlimages/curl:8.12.1
    entrypoint: ["sh", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    networks:
      client_to_cloudflare_v6:
        ipv6_address: 2001:db8:100::10

  client_v6_b:
    image: curlimages/curl:8.12.1
    entrypoint: ["sh", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    networks:
      client_to_cloudflare_v6:
        ipv6_address: 2001:db8:100::11

  direct_client:
    image: curlimages/curl:8.12.1
    entrypoint: ["sh", "-c"]
    command: ["trap : TERM INT; sleep infinity & wait"]
    networks:
      direct_to_npm:
        ipv4_address: 203.0.113.10

networks:
  app_net:
    internal: true
    ipam:
      config:
        - subnet: 10.254.251.0/24
  npm_to_app:
    internal: true
    ipam:
      config:
        - subnet: 10.254.252.0/24
  client_to_cloudflare_v4:
    internal: true
    ipam:
      config:
        - subnet: 198.51.100.0/24
  client_to_cloudflare_v6:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2001:db8:100::/64
  # Small subnets carved from ranges fetched into cloudflare-ips.conf on
  # 2026-08-27. The runner first proves both remain in that live-fetched file.
  cloudflare_to_npm_v4:
    internal: true
    ipam:
      config:
        - subnet: 173.245.63.248/29
  cloudflare_to_npm_v6:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
    ipam:
      config:
        - subnet: 2400:cb00:ffff:ffff::/124
  direct_to_npm:
    internal: true
    ipam:
      config:
        - subnet: 203.0.113.0/24

volumes:
  app_storage:
  app_cache:
