map $http_x_harness_cf_mode $harness_cf_connecting_ip {
    default $remote_addr;
    absent  "";
    invalid "not-an-ip";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://fake_npm;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # Match the measured Cloudflare behavior in work-order section 2.
        proxy_set_header CF-Connecting-IP $harness_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP "";

        # Harness controls must not leak beyond the fake edge/NPM pair.
        proxy_set_header X-Harness-CF-Mode "";
    }
}
