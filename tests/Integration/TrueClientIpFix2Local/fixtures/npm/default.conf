map $http_x_harness_npm_mode $harness_x_real_ip {
    default $remote_addr;
    absent  "";
    invalid "not-an-ip";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        proxy_pass http://pos_nginx;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        # Match the measured NPM behavior in work-order section 2.
        proxy_set_header X-Real-IP $harness_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_set_header X-Harness-NPM-Mode "";
    }
}
